name: Legal Intelligence CI

on:
  push:
    branches:
      - feature/legal-intelligence-engine-v1
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies and refresh lockfile
        run: bun install

      - name: Type check
        run: bun run lint

      - name: Tests
        run: bun run test

      - name: Build
        run: bun run build

      - name: Commit refreshed lockfile on feature branch
        if: github.event_name == 'push' && github.ref_name == 'feature/legal-intelligence-engine-v1'
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore(deps): refresh bun lockfile"
          git push
